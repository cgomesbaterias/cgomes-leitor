<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>CGomes Vendas</title>

<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
    background: #f3f4f6;
}

.caixa {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.10);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitulo {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.botao-leitura {
    background: #1a73e8;
    color: white;
}

.botao-adicionar {
    background: #188038;
    color: white;
}

.botao-finalizar {
    background: #137333;
    color: white;
}

.botao-excluir {
    background: #d93025;
    color: white;
    width: auto;
    padding: 8px 12px;
    font-size: 14px;
}

#reader {
    margin-top: 20px;
}

#resultado {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
}

.info {
    background: #eeeeee;
}

.sucesso {
    background: #e5f7e8;
}

.erro {
    background: #ffe5e5;
    color: #9b0000;
}

.campo {
    margin-top: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    font-size: 17px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

input[readonly] {
    background: #f1f1f1;
}

.produto-pendente {
    margin-top: 20px;
    padding: 15px;
    border: 2px solid #1a73e8;
    border-radius: 10px;
}

.carrinho {
    margin-top: 25px;
}

.item-carrinho {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-top: 12px;
    background: #fafafa;
}

.item-carrinho strong {
    font-size: 17px;
}

.linha {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
}

.total {
    margin-top: 20px;
    padding: 18px;
    background: #eeeeee;
    border-radius: 10px;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
}

.pequeno {
    font-size: 14px;
    color: #666;
    margin-top: 15px;
}

.oculto {
    display: none;
}

</style>

</head>


<body>

<div class="caixa">

<h1>CGomes Vendas</h1>

<div class="subtitulo">
Carrinho de vendas
</div>


<!-- =================================================
     LEITURA
================================================= -->

<button
    class="botao-leitura"
    onclick="iniciarLeitor()">

📷 Ler código de barras

</button>


<div id="reader"></div>


<div id="resultado"
     class="info">

Aguardando leitura...

</div>


<!-- =================================================
     PRODUTO LIDO
================================================= -->

<div id="produtoPendente"
     class="produto-pendente oculto">

<h3>Produto encontrado</h3>


<div class="campo">

<label>Código</label>

<input
    id="codigoProduto"
    type="text"
    readonly>

</div>


<div class="campo">

<label>Produto</label>

<input
    id="nomeProduto"
    type="text"
    readonly>

</div>


<div class="campo">

<label>Preço da venda</label>

<input
    id="precoProduto"
    type="number"
    step="0.01"
    inputmode="decimal">

</div>


<div class="campo">

<label>Quantidade</label>

<input
    id="quantidadeProduto"
    type="number"
    min="1"
    step="1"
    value="1">

</div>


<button
    class="botao-adicionar"
    onclick="adicionarAoCarrinho()">

➕ Adicionar ao carrinho

</button>


</div>


<!-- =================================================
     CARRINHO
================================================= -->

<div id="areaCarrinho"
     class="carrinho">

<h2>🛒 Carrinho</h2>


<div id="listaCarrinho">

Nenhum produto adicionado.

</div>


<div id="totalCarrinho"
     class="total">

Total: R$ 0,00

</div>


<button
    id="botaoContinuar"
    class="botao-finalizar oculto"
    onclick="continuarVenda()">

➡️ Continuar venda

</button>


</div>


</div>


<script>


/* =================================================
   CONFIGURAÇÃO
================================================= */


const URL_APPS_SCRIPT =

"https://script.google.com/macros/s/AKfycbwd-MCsNCIya2NHxRxV6eMsyQMpZHsvxw5PvsE6O6E4_hg3gw6P63HkwYqiNZ0i_nGsaQ/exec";


/* =================================================
   VARIÁVEIS
================================================= */


let leitor = null;

let leitorAtivo = false;


/*
   Produtos que já foram adicionados
   à venda.
*/

let carrinho = [];


/*
   Produto que acabou de ser lido
   e ainda não foi adicionado.
*/

let produtoPendente = null;


/* =================================================
   INICIAR LEITOR
================================================= */


function iniciarLeitor() {


    const resultado =
        document.getElementById("resultado");


    resultado.className = "info";


    resultado.innerHTML =
        "Solicitando acesso à câmera...";


    /*
       Se já houver leitor aberto,
       não cria outro.
    */


    if (leitorAtivo) {

        return;

    }


    leitor =
        new Html5Qrcode("reader");


    const configuracao = {

        fps: 10,

        qrbox: {

            width: 320,

            height: 180

        },

        formatsToSupport: [

            Html5QrcodeSupportedFormats.CODE_128

        ]

    };


    leitor.start(

        {

            facingMode: "environment"

        },

        configuracao,


        function(codigo) {


            if (!leitorAtivo) {

                return;

            }


            leitorAtivo = false;


            resultado.className =
                "sucesso";


            resultado.innerHTML =

                "<strong>Código lido:</strong><br><br>" +

                codigo +

                "<br><br>" +

                "Consultando produto...";


            leitor.stop()

                .then(function() {

                    document
                        .getElementById("reader")
                        .innerHTML = "";

                })

                .catch(function() {

                    document
                        .getElementById("reader")
                        .innerHTML = "";

                });


            buscarProduto(codigo);

        },


        function(erro) {

            /*
               Erros durante a procura
               são ignorados.
            */

        }

    )


    .then(function() {


        leitorAtivo = true;


        resultado.className =
            "info";


        resultado.innerHTML =

            "Câmera ativada.<br><br>" +

            "Aponte para o código de barras.";

    })


    .catch(function(erro) {


        leitorAtivo = false;


        resultado.className =
            "erro";


        resultado.innerHTML =

            "<strong>Não foi possível acessar a câmera.</strong>" +

            "<br><br>" +

            "Verifique a permissão da câmera no iPhone.";

    });

}


/* =================================================
   BUSCAR PRODUTO
================================================= */


function buscarProduto(codigo) {


    const url =

        URL_APPS_SCRIPT +

        "?acao=buscarProduto" +

        "&codigo=" +

        encodeURIComponent(codigo) +

        "&callback=receberProduto";


    const script =
        document.createElement("script");


    script.src = url;


    document.body.appendChild(script);

}


/* =================================================
   RECEBER PRODUTO
================================================= */


function receberProduto(resultado) {


    const area =
        document.getElementById("resultado");


    if (!resultado.encontrado) {


        area.className =
            "erro";


        area.innerHTML =

            "<strong>Produto não encontrado.</strong>" +

            "<br><br>" +

            resultado.mensagem;


        return;

    }


    /*
       Guarda o produto temporariamente.
    */


    produtoPendente = resultado;


    /*
       Preenche os campos.
    */


    document.getElementById("codigoProduto").value =
        resultado.codigo;


    document.getElementById("nomeProduto").value =
        resultado.produto;


    document.getElementById("precoProduto").value =
        resultado.preco !== null &&
        resultado.preco !== undefined
            ? resultado.preco
            : "";


    document.getElementById("quantidadeProduto").value =
        1;


    /*
       Mostra o produto.
    */


    document
        .getElementById("produtoPendente")
        .classList
        .remove("oculto");


    area.className =
        "sucesso";


    area.innerHTML =

        "<strong>Produto encontrado!</strong><br><br>" +

        resultado.produto;

}


/* =================================================
   ADICIONAR AO CARRINHO
================================================= */


function adicionarAoCarrinho() {


    if (!produtoPendente) {

        alert(
            "Nenhum produto foi selecionado."
        );

        return;

    }


    const codigo =
        document
            .getElementById("codigoProduto")
            .value;


    const produto =
        document
            .getElementById("nomeProduto")
            .value;


    const preco =
        Number(
            document
                .getElementById("precoProduto")
                .value
        );


    const quantidade =
        Number(
            document
                .getElementById("quantidadeProduto")
                .value
        );


    /*
       Validação do preço.
    */


    if (
        isNaN(preco) ||
        preco < 0
    ) {

        alert(
            "Informe um preço válido."
        );

        return;

    }


    /*
       Validação da quantidade.
    */


    if (
        isNaN(quantidade) ||
        quantidade <= 0
    ) {

        alert(
            "Informe uma quantidade válida."
        );

        return;

    }


    /*
       Adiciona o produto.
    */


    carrinho.push({

        codigo: codigo,

        produto: produto,

        preco: preco,

        quantidade: quantidade,

        subtotal:
            preco * quantidade

    });


    /*
       Limpa o produto pendente.
    */


    produtoPendente = null;


    document
        .getElementById("produtoPendente")
        .classList
        .add("oculto");


    document
        .getElementById("resultado")
        .className = "sucesso";


    document
        .getElementById("resultado")
        .innerHTML =

        "✅ Produto adicionado ao carrinho.";


    /*
       Atualiza o carrinho.
    */


    atualizarCarrinho();

}


/* =================================================
   ATUALIZAR CARRINHO
================================================= */


function atualizarCarrinho() {


    const lista =
        document.getElementById("listaCarrinho");


    if (carrinho.length === 0) {


        lista.innerHTML =
            "Nenhum produto adicionado.";


        document
            .getElementById("totalCarrinho")
            .innerHTML =
            "Total: R$ 0,00";


        document
            .getElementById("botaoContinuar")
            .classList
            .add("oculto");


        return;

    }


    let html = "";

    let total = 0;


    carrinho.forEach(function(item, indice) {


        const subtotal =
            item.preco *
            item.quantidade;


        item.subtotal =
            subtotal;


        total += subtotal;


        html += `

            <div class="item-carrinho">

                <strong>
                    ${indice + 1}. ${escaparHTML(item.produto)}
                </strong>

                <br><br>

                Código:
                ${escaparHTML(item.codigo)}

                <div class="linha">

                    <span>
                        Quantidade:
                    </span>

                    <strong>
                        ${item.quantidade}
                    </strong>

                </div>


                <div class="linha">

                    <span>
                        Preço:
                    </span>

                    <strong>
                        R$ ${formatarMoeda(item.preco)}
                    </strong>

                </div>


                <div class="linha">

                    <span>
                        Subtotal:
                    </span>

                    <strong>
                        R$ ${formatarMoeda(subtotal)}
                    </strong>

                </div>


                <button
                    class="botao-excluir"
                    onclick="removerProduto(${indice})">

                    🗑️ Excluir

                </button>

            </div>

        `;

    });


    lista.innerHTML = html;


    document
        .getElementById("totalCarrinho")
        .innerHTML =

        "Total: R$ " +
        formatarMoeda(total);


    document
        .getElementById("botaoContinuar")
        .classList
        .remove("oculto");

}


/* =================================================
   REMOVER PRODUTO
================================================= */


function removerProduto(indice) {


    carrinho.splice(indice, 1);


    atualizarCarrinho();


}


/* =================================================
   TOTAL DA VENDA
================================================= */


function obterTotalVenda() {


    let total = 0;


    carrinho.forEach(function(item) {

        total +=
            item.preco *
            item.quantidade;

    });


    return total;

}


/* =================================================
   CONTINUAR VENDA
================================================= */


function continuarVenda() {


    if (carrinho.length === 0) {


        alert(
            "Adicione pelo menos um produto."
        );


        return;

    }


    const total =
        obterTotalVenda();


    alert(

        "Carrinho pronto!\n\n" +

        "Produtos: " +
        carrinho.length +

        "\n\n" +

        "Total: R$ " +
        formatarMoeda(total) +

        "\n\n" +

        "Na próxima etapa vamos adicionar " +

        "Vendedor/Entregador, Comissão/Frete " +

        "e os pagamentos múltiplos."

    );

}


/* =================================================
   FORMATAR MOEDA
================================================= */


function formatarMoeda(valor) {


    const numero =
        Number(valor);


    if (isNaN(numero)) {

        return "0,00";

    }


    return numero.toLocaleString(

        "pt-BR",

        {

            minimumFractionDigits: 2,

            maximumFractionDigits: 2

        }

    );

}


/* =================================================
   ESCAPAR HTML
================================================= */


function escaparHTML(valor) {


    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }


    return String(valor)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


</script>

</body>

</html>
