<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CGomes - Leitor</title>

<script src="https://unpkg.com/html5-qrcode"
type="text/javascript"></script>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f3f4f6;
}

.caixa {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 2px 10px rgba(0,0,0,.10);
}

h1 {
    text-align: center;
}

p {
    text-align: center;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 15px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
}

#reader {
    margin-top: 20px;
}

#resultado {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-size: 20px;
}

.sucesso {
    background: #e5f7e8;
}

.erro {
    background: #ffe5e5;
}

</style>

</head>


<body>


<div class="caixa">


<h1>CGomes Vendas</h1>

<p>
Teste do leitor de código de barras
</p>


<button
onclick="iniciarLeitor()">

📷 Ler código de barras

</button>


<div id="reader"></div>


<div id="resultado">

Aguardando leitura...

</div>


</div>


<script>

let leitor = null;


function iniciarLeitor() {

    document.getElementById("resultado")
        .innerHTML = "Solicitando acesso à câmera...";


    leitor = new Html5Qrcode("reader", {

        formatsToSupport: [
            Html5QrcodeSupportedFormats.CODE_128
        ]

    });


    const configuracao = {

        fps: 10,

        qrbox: {
            width: 300,
            height: 160
        }

    };


    leitor.start(

        {
            facingMode: "environment"
        },

        configuracao,

        function(codigo) {

    document.getElementById("resultado")
        .className = "sucesso";

    document.getElementById("resultado")
        .innerHTML =
        "<strong>Código lido:</strong><br><br>" +
        codigo +
        "<br><br>Consultando produto...";


    leitor.stop().then(function() {

        document.getElementById("reader")
            .innerHTML = "";

    });


    buscarProduto(codigo);

}
        function(erro) {

            // Ignora erros normais
            // durante a procura do código.

        }

    )

    .then(function() {

        document.getElementById("resultado")
            .innerHTML =
            "Câmera ativada.<br>" +
            "Aponte para o código de barras.";

    })

    .catch(function(erro) {

        document.getElementById("resultado")
            .className = "erro";


        document.getElementById("resultado")
            .innerHTML =
            "<strong>Não foi possível acessar a câmera.</strong><br><br>" +
            erro;

    });

}
function buscarProduto(codigo) {

    const urlAppsScript =
        "https://script.google.com/macros/s/AKfycbwd-MCsNCIya2NHxRxV6eMsyQMpZHsvxw5PvsE6O6E4_hg3gw6P63HkwYqiNZ0i_nGsaQ/exec";


    const url =
        urlAppsScript +
        "?acao=buscarProduto" +
        "&codigo=" +
        encodeURIComponent(codigo) +
        "&callback=receberProduto";


    const script =
        document.createElement("script");


    script.src = url;


    document.body.appendChild(script);

}


function receberProduto(resultado) {

    if (!resultado.encontrado) {

        document.getElementById("resultado")
            .className = "erro";


        document.getElementById("resultado")
            .innerHTML =
            "<strong>Produto não encontrado</strong><br><br>" +
            resultado.mensagem;

        return;

    }


    const preco =
        resultado.preco !== "" &&
        resultado.preco !== null
            ? resultado.preco
            : "";


    document.getElementById("resultado")
        .className = "sucesso";


    document.getElementById("resultado")
        .innerHTML = `

        <strong>Produto encontrado!</strong>

        <br><br>

        <label>Código</label>

        <input
            type="text"
            value="${resultado.codigo}"
            readonly>

        <br><br>

        <label>Produto</label>

        <input
            type="text"
            value="${resultado.produto}"
            readonly>

        <br><br>

        <label>Preço</label>

        <input
            id="preco"
            type="number"
            step="0.01"
            value="${preco}">

        <br><br>

        <label>Quantidade</label>

        <input
            id="quantidade"
            type="number"
            min="1"
            value="1">

        `;

}
</script>


</body>

</html>
